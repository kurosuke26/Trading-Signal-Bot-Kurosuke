name: Kurosuke Data Collection

on:
  schedule:
    # 【2026-08-27変更】23:00 JST開始→21:00 JST開始に前倒し。収集完了を
    # post_signals.yml（workflow_run）が検知して投稿する構成に変わったため、
    # 開始を早めるほど「07:45 JSTまでの安全マージン」が広がり、収集側の
    # 遅延（ジョブのキューイング待ち等）に強くなる。
    # 12:00 UTC = 21:00 JST（同日）。日〜金曜の夜（＝月〜土曜朝の投稿用）に実行し、
    # その日の取引終了後の終値を約4時間（〜翌01:00 JST頃）かけてペースを抑えながら
    # 収集する。土曜夜（＝日曜朝投稿用）は取引が無く収集の意味が無いためスキップ
    # （day-of-weekは0=日曜〜5=金曜。UTCでの曜日評価だが、この時刻ならJSTの曜日と
    # 一致するため実質「日〜金曜の夜」を指定している）。
    - cron: '0 12 * * 0-5'
  workflow_dispatch:
    inputs:
      max_tickers:
        description: 'テスト実行用：対象銘柄数の上限（空欄なら全銘柄・約3900銘柄を対象）'
        required: false
        default: ''
      time_budget_minutes:
        description: '非常停止ライン（分）。超過分の銘柄は打ち切ってスキップします'
        required: false
        default: '230'

permissions:
  contents: write  # data/latest_scan.json をリポジトリにコミットするために必要

jobs:
  collect:
    runs-on: ubuntu-latest
    # ペーシングにより意図的に時間をかけるため、ジョブのタイムアウトにも余裕を持たせる
    timeout-minutes: 280

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data collection
      env:
        MAX_TICKERS: ${{ github.event.inputs.max_tickers }}
        TIME_BUDGET_MINUTES: ${{ github.event.inputs.time_budget_minutes || '230' }}
      run: python collector.py

    - name: Commit and push snapshot
      if: always()  # 途中で時間予算超過により打ち切られた場合でも、そこまでの結果は保存する
      run: |
        if [ ! -f data/latest_scan.json ]; then
          echo "data/latest_scan.json が生成されていないため、コミットをスキップします"
          exit 0
        fi
        git config user.name "kurosuke-bot"
        git config user.email "kurosuke-bot@users.noreply.github.com"
        git add data/latest_scan.json
        # data/trade_log.json は本番実行（MAX_TICKERS未指定）時のみ生成される。
        # テスト実行ではノイズ混入を避けるため意図的に作成されないので、存在する時だけ追加する。
        if [ -f data/trade_log.json ]; then
          git add data/trade_log.json
        fi
        if git diff --cached --quiet; then
          echo "変更なし（データは前回と同一）のためコミットをスキップします"
        else
          git commit -m "chore: update daily scan data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
        fi

    - name: Success notification
      if: success()
      run: echo "✅ Kurosuke data collection completed successfully at $(date)"

    - name: Failure notification
      if: failure()
      run: echo "❌ Kurosuke data collection failed at $(date)"
