name: Kurosuke Discord Posting

on:
  schedule:
    # 23:00 UTC（前日）= 08:00 JST（当日）。月〜土曜朝に投稿し、日曜朝は投稿しない
    # （day-of-weekは0=日曜〜5=金曜のUTC値。この時刻はJST日付が翌日にずれるため、
    # UTC日曜〜金曜＝JST月曜〜土曜に対応する）。collect_data.yml（23:00 JST開始・
    # 約4時間）が終わった後に、保存済みのデータを読み込んでDiscordへ投稿するだけの
    # 軽い処理。
    - cron: '0 23 * * 0-5'
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      # data/latest_scan.json は collect_data.yml がリポジトリにコミットしたものを
      # そのままcheckoutで取得する。

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Post signals to Discord
      env:
        DISCORD_WEBHOOK_URL_LONG_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_LONG_TEST }}
        DISCORD_WEBHOOK_URL_SHORT_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_SHORT_TEST }}
        DISCORD_WEBHOOK_URL_WARNING_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_WARNING_TEST }}
        DISCORD_WEBHOOK_URL_PERFORMANCE_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_PERFORMANCE_TEST }}
        DISCORD_WEBHOOK_URL_SAKATA_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_SAKATA_TEST }}
        DISCORD_WEBHOOK_URL_LONG_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_LONG_PROD }}
        DISCORD_WEBHOOK_URL_SHORT_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_SHORT_PROD }}
        DISCORD_WEBHOOK_URL_WARNING_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_WARNING_PROD }}
        DISCORD_WEBHOOK_URL_PERFORMANCE_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_PERFORMANCE_PROD }}
        DISCORD_WEBHOOK_URL_SAKATA_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_SAKATA_PROD }}
        DISCORD_WEBHOOK_URL_BACKTEST_TEST: ${{ secrets.DISCORD_WEBHOOK_URL_BACKTEST_TEST }}
        DISCORD_WEBHOOK_URL_BACKTEST_PROD: ${{ secrets.DISCORD_WEBHOOK_URL_BACKTEST_PROD }}
      run: python poster.py

    - name: Success notification
      if: success()
      run: echo "✅ Kurosuke posting completed successfully at $(date)"

    - name: Failure notification
      if: failure()
      run: echo "❌ Kurosuke posting failed at $(date)"
