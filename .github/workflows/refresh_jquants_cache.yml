name: Kurosuke J-Quants Cache Refresh

on:
  schedule:
    # 【2026-09-07変更】このリポジトリを公開（public）化する前提に変更したため、
    # GitHub Actions無料枠（標準ランナーはpublicリポジトリで無料・無制限）の制約が
    # 無くなった。J-Quants Freeプラン側のレート制限（5回/分）はリポジトリの公開/非公開に
    # 関係なく変わらないため、そちらを律速に「1ジョブでどこまで進められるか」を最大化する
    # 方針にする。GitHub-hostedランナーは1ジョブ最大6時間（360分）のハード上限があるため、
    # budget_minutes=300（実処理5時間）+ チェックアウト等のオーバーヘッド分を見て
    # timeout-minutes=340に設定。毎日06:00 UTC（15:00 JST）実行、
    # 全銘柄（約3,900件）を約5〜6日で一巡できる計算。
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: '1回の実行での処理時間の目安（分）。GitHub-hostedランナーの1ジョブ上限（6時間）を超えないよう340分未満にすること'
        required: false
        default: '300'
      stale_after_days:
        description: 'この日数を超えて未更新の銘柄だけを更新対象にする（小さいほど「最も古いものから常に更新」に近づく）'
        required: false
        default: '3'

permissions:
  contents: write  # data/jquants_cache/ をリポジトリにコミットするために必要

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh J-Quants cache
      env:
        JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        JQUANTS_REFRESH_BUDGET_MINUTES: ${{ github.event.inputs.budget_minutes || '300' }}
        JQUANTS_REFRESH_STALE_AFTER_DAYS: ${{ github.event.inputs.stale_after_days || '3' }}
      run: python refresh_jquants_cache.py

    - name: Commit and push cache updates
      if: always()  # 時間予算超過で打ち切られても、そこまでの更新分は保存する
      run: |
        git config user.name "kurosuke-bot"
        git config user.email "kurosuke-bot@users.noreply.github.com"
        git add data/jquants_cache
        if git diff --cached --quiet; then
          echo "変更なし（更新対象が無かった、または全て失敗）のためコミットをスキップします"
        else
          git commit -m "chore: refresh J-Quants cache ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # collect_data.ymlと同じ理由（他ワークフローのpushとの衝突回避）でリトライする
          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[refresh] push が${max_attempts}回失敗しました。断念します"
              exit 1
            fi
            wait_seconds=$((10 * attempt))
            echo "[refresh] push が拒否されました（試行${attempt}/${max_attempts}）。${wait_seconds}秒待ってrebaseの上、再試行します"
            sleep "$wait_seconds"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "[refresh] rebase中にコンフリクトが発生しました。自動解決できないため中断します"
              git rebase --abort
              exit 1
            fi
            attempt=$((attempt + 1))
          done
          echo "[refresh] push成功（試行${attempt}回目）"
        fi

    - name: Success notification
      if: success()
      run: echo "✅ Kurosuke J-Quants cache refresh completed at $(date)"

    - name: Failure notification
      if: failure()
      run: echo "❌ Kurosuke J-Quants cache refresh failed at $(date)"
