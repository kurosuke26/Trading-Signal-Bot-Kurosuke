name: Kurosuke J-Quants Cache Refresh

on:
  schedule:
    # 【2026-09-07変更：連続稼働化】公開リポジトリのGitHub Actions標準ランナーは
    # 無料・無制限だが、GitHub-hostedランナーは1ジョブ最大6時間（360分）のハード上限が
    # あるため、1回のジョブだけではそれ以上の時間は使えない。そこで「ジョブの所要時間より
    # 短い間隔でcronを発火させ、concurrency（下記）で多重実行を防ぐ」ことで、
    # 前の実行が終わった瞬間に次の実行が始まる“連続稼働”を作る。2時間おきに発火させ、
    # 実際には1回あたり最大約5.5時間（budget_minutes=300+オーバーヘッド）かかるため、
    # 常に「実行中1件＋待機中1件」の状態になり、実質24時間近く動き続ける計算になる
    # （J-Quants Freeプランのレート制限（5回/分）自体は変わらないため、スループットの
    # 上限はそちらで頭打ちになる）。これにより全銘柄（約3,900件）の一巡が
    # 約5〜6日→約1日に短縮される見込み。
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: '1回の実行での処理時間の目安（分）。GitHub-hostedランナーの1ジョブ上限（6時間）を超えないよう340分未満にすること'
        required: false
        default: '300'
      stale_after_days:
        description: 'この日数を超えて未更新の銘柄だけを更新対象にする（小さいほど「最も古いものから常に更新」に近づく）'
        required: false
        default: '1'

# 【2026-09-07追加】cronの発火間隔（2時間）よりジョブの所要時間（最大約5.5時間）の方が
# 長いため、何もしなければ複数ジョブが同時に走り、同じ銘柄を重複して取得する無駄が生じる。
# cancel-in-progress:falseの多重実行防止で、前の実行が終わるまで次を待たせ、
# 終わり次第すぐ次を開始する“連続稼働”にする。
concurrency:
  group: kurosuke-jquants-cache-refresh
  cancel-in-progress: false

permissions:
  contents: write  # data/jquants_cache/ をリポジトリにコミットするために必要

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh J-Quants cache
      env:
        JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        JQUANTS_REFRESH_BUDGET_MINUTES: ${{ github.event.inputs.budget_minutes || '300' }}
        JQUANTS_REFRESH_STALE_AFTER_DAYS: ${{ github.event.inputs.stale_after_days || '1' }}
      run: python refresh_jquants_cache.py

    - name: Commit and push cache updates
      if: always()  # 時間予算超過で打ち切られても、そこまでの更新分は保存する
      run: |
        git config user.name "kurosuke-bot"
        git config user.email "kurosuke-bot@users.noreply.github.com"
        git add data/jquants_cache
        if git diff --cached --quiet; then
          echo "変更なし（更新対象が無かった、または全て失敗）のためコミットをスキップします"
        else
          git commit -m "chore: refresh J-Quants cache ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # collect_data.ymlと同じ理由（他ワークフローのpushとの衝突回避）でリトライする
          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[refresh] push が${max_attempts}回失敗しました。断念します"
              exit 1
            fi
            wait_seconds=$((10 * attempt))
            echo "[refresh] push が拒否されました（試行${attempt}/${max_attempts}）。${wait_seconds}秒待ってrebaseの上、再試行します"
            sleep "$wait_seconds"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "[refresh] rebase中にコンフリクトが発生しました。自動解決できないため中断します"
              git rebase --abort
              exit 1
            fi
            attempt=$((attempt + 1))
          done
          echo "[refresh] push成功（試行${attempt}回目）"
        fi

    - name: Success notification
      if: success()
      run: echo "✅ Kurosuke J-Quants cache refresh completed at $(date)"

    - name: Failure notification
      if: failure()
      run: echo "❌ Kurosuke J-Quants cache refresh failed at $(date)"
