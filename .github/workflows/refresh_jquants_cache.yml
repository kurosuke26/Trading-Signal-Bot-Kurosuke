name: Kurosuke J-Quants Cache Refresh

on:
  schedule:
    # 【2026-09-07変更】collect_data.yml自体が設計上230分×週6日≒月5,900分規模で
    # 無料枠（非公開リポジトリ月2,000分）を単独で超えうる状態のため、この追加分は
    # できる限り小さくする。火・金 06:00 UTC（15:00 JST）の週2回・1回30分予算に縮小
    # （月間 約30分×2回×4.3週 ≒ 260分の追加見込み）。全銘柄（約3,900件）を一巡させる
    # のに数ヶ月かかる計算になるが、新規上場銘柄は毎回最優先されるため実害は小さいと判断。
    # 実際の残り予算はGitHubの Settings > Billing で確認の上、必要に応じて
    # budget_minutes（workflow_dispatch）やこのcronを調整すること。
    - cron: '0 6 * * 2,5'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: '1回の実行での処理時間の目安（分）'
        required: false
        default: '30'
      stale_after_days:
        description: 'この日数を超えて未更新の銘柄だけを更新対象にする'
        required: false
        default: '30'

permissions:
  contents: write  # data/jquants_cache/ をリポジトリにコミットするために必要

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Refresh J-Quants cache
      env:
        JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        JQUANTS_REFRESH_BUDGET_MINUTES: ${{ github.event.inputs.budget_minutes || '30' }}
        JQUANTS_REFRESH_STALE_AFTER_DAYS: ${{ github.event.inputs.stale_after_days || '30' }}
      run: python refresh_jquants_cache.py

    - name: Commit and push cache updates
      if: always()  # 時間予算超過で打ち切られても、そこまでの更新分は保存する
      run: |
        git config user.name "kurosuke-bot"
        git config user.email "kurosuke-bot@users.noreply.github.com"
        git add data/jquants_cache
        if git diff --cached --quiet; then
          echo "変更なし（更新対象が無かった、または全て失敗）のためコミットをスキップします"
        else
          git commit -m "chore: refresh J-Quants cache ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # collect_data.ymlと同じ理由（他ワークフローのpushとの衝突回避）でリトライする
          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "[refresh] push が${max_attempts}回失敗しました。断念します"
              exit 1
            fi
            wait_seconds=$((10 * attempt))
            echo "[refresh] push が拒否されました（試行${attempt}/${max_attempts}）。${wait_seconds}秒待ってrebaseの上、再試行します"
            sleep "$wait_seconds"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "[refresh] rebase中にコンフリクトが発生しました。自動解決できないため中断します"
              git rebase --abort
              exit 1
            fi
            attempt=$((attempt + 1))
          done
          echo "[refresh] push成功（試行${attempt}回目）"
        fi

    - name: Success notification
      if: success()
      run: echo "✅ Kurosuke J-Quants cache refresh completed at $(date)"

    - name: Failure notification
      if: failure()
      run: echo "❌ Kurosuke J-Quants cache refresh failed at $(date)"
